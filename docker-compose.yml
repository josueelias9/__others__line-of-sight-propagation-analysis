services:
  db:
    image: postgres:16
    container_name: db-container
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-container
    environment:
      - PGADMIN_DEFAULT_EMAIL
      - PGADMIN_DEFAULT_PASSWORD
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dev.Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - BACKEND_API_URL
      # TODO: this should be refactored to use a single env var for the entire connection string
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - NEXTAUTH_URL
      - AUTH_SECRET
    container_name: frontend-container

  backend-init:
    build: ./backend
    command: bash scripts/prestart.sh
    env_file:
      - .env
    container_name: backend-init-container
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    container_name: backend-container
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully

volumes:
  postgres_data: